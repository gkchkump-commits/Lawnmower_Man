name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Electron binary is not needed for tests (main-process logic is tested under plain Node).
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  app-linux:
    name: App (lint, unit, build, e2e) — Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install npm dependencies
        run: npm ci
      - name: Install voice server (fake engines are used by one e2e spec)
        run: python -m pip install -e "./voice[dev]"
      - name: Lint
        run: npx eslint .
      - name: Unit tests
        run: npx vitest run
      - name: Build renderer
        run: npx vite build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (SwiftShader WebGL, mock bridge)
        run: npx playwright test
        env:
          CI: '1'
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  app-windows:
    name: App (unit tests) — Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Unit tests
        run: npx vitest run
      - name: Build renderer
        run: npx vite build

  voice:
    name: Voice server — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install voice package (core + dev, no GPU stack)
        run: python -m pip install -e "./voice[dev]"
      - name: Tests (model engines mocked)
        working-directory: voice
        run: python -m pytest -q
