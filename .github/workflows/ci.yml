name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Electron binary is not needed for tests (main-process logic is tested under plain Node).
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  app-linux:
    name: App (lint, unit, build, e2e) — Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install npm dependencies
        run: npm ci
      - name: Install voice server (fake engines are used by one e2e spec)
        run: python -m pip install -e "./voice[dev]"
      - name: Lint
        run: npx eslint .
      - name: Unit tests
        run: npx vitest run
      - name: Build renderer
        run: npx vite build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (SwiftShader WebGL, mock bridge)
        run: npx playwright test
        env:
          CI: '1'
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  tapo-e2e-linux:
    # The Home camera end to end in the real Electron app against the camera simulator
    # (tools/tapo-sim), with the real go2rtc and the fake Claude CLI (docs/TAPO.md, "Tests").
    name: Home camera (Electron e2e vs. simulator) — Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # this job needs the Electron binary (the workflow-wide setting skips it)
      ELECTRON_SKIP_BINARY_DOWNLOAD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies (with the Electron binary)
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: System libraries for Electron, and Xvfb
        run: |
          npx playwright install-deps chromium
          command -v xvfb-run || sudo apt-get install -y xvfb
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox uses
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Fetch go2rtc (pinned release, SHA-256 checked)
        run: npm run fetch:go2rtc -- --platform linux-x64
      - name: Build renderer
        run: npx vite build
      - name: Camera simulator self-tests and the integration tests against it
        run: npx vitest run tests/unit/tapo-sim
      - name: End-to-end (xvfb)
        run: xvfb-run -a node scripts/tapo-e2e.mjs --report tapo-e2e/report.json --shots tapo-e2e/shots
      - name: Upload the report and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tapo-e2e
          path: tapo-e2e/
          retention-days: 7

  app-windows:
    name: App (unit tests) — Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Unit tests
        run: npx vitest run
      - name: Build renderer
        run: npx vite build

  voice:
    name: Voice server — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install voice package (core + dev, no GPU stack)
        run: python -m pip install -e "./voice[dev]"
      - name: Tests (model engines mocked)
        working-directory: voice
        run: python -m pytest -q
